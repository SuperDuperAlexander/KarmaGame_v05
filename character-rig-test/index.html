<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>Character rig test</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <canvas id="view" aria-label="3D character test"></canvas>
  <aside id="debug" aria-live="polite">GLB load: Loading...</aside>
  <div id="hint">W A S D: move · Drag: camera · Wheel: zoom</div>
  <button id="walk-preview" type="button">Walk test</button>
  <div id="touch" aria-label="Move controls">
    <button data-key="w" aria-label="Forward">▲</button>
    <div><button data-key="a" aria-label="Left">◀</button><button data-key="s" aria-label="Back">▼</button><button data-key="d" aria-label="Right">▶</button></div>
  </div>
  <script type="module" src="/main.ts"></script>
</body>
</html>
